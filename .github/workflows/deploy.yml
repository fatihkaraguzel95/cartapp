name: Deploy to Hetzner

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Create deployment archive
        run: |
          tar -czf deploy.tar.gz \
            .next/standalone \
            .next/static \
            public

      - name: Upload archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy.tar.gz
          target: /opt/cartapp-deploy/

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            mkdir -p /opt/cartapp-new
            tar -xzf /opt/cartapp-deploy/deploy.tar.gz -C /opt/cartapp-new

            cat > /opt/cartapp-new/Dockerfile.deploy << 'EOF'
            FROM node:20-alpine
            WORKDIR /app
            ENV NODE_ENV=production
            RUN addgroup --system --gid 1001 nodejs && adduser --system --uid 1001 nextjs
            COPY public ./public
            COPY .next/standalone ./
            COPY .next/static ./.next/static
            USER nextjs
            EXPOSE 3000
            ENV PORT=3000
            ENV HOSTNAME="0.0.0.0"
            CMD ["node", "server.js"]
            EOF

            cd /opt/cartapp-new
            docker build -t cartapp:latest -f Dockerfile.deploy .

            docker stop cartapp 2>/dev/null || true
            docker rm cartapp 2>/dev/null || true

            docker run -d \
              --name cartapp \
              --restart unless-stopped \
              -p 3000:3000 \
              -e SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -e ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
              cartapp:latest

            rm -rf /opt/cartapp-new /opt/cartapp-deploy/deploy.tar.gz
            docker image prune -f
            echo "Deploy tamamlandi: $(date)"
